[package]
name = "monolith"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pico-args = "0.5"
chrono = { version = "0.4", features = ["serde"] }
colored = "2.0"
humansize = "2.1"
serde = { version = "1.0", features = ["derive"] }
indicatif = "0.17"
git2 = "0.14"
rayon = "1.6"
clap = { version = "4.0.32", features = ["derive"] }
regex = "1.5"
structopt = "0.3"

[dev-dependencies]
tempfile = "3.2"
