[package]
name = "monarch-rs"
version = "0.1.0"
edition = "2024"
description = "Advanced Git Management Suite for handling multiple repositories concurrently"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/jwliles/monarch-rs"
keywords = ["git", "repository", "management", "hooks", "concurrent"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pico-args = "0.5"
chrono = { version = "0.4", features = ["serde"] }
colored = "2.0"
humansize = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
indicatif = "0.17"
git2 = "0.14"
rayon = "1.6"
clap = { version = "4.0.32", features = ["derive"] }
regex = "1.5"
structopt = "0.3"

# UI dependencies
egui = "0.24"
eframe = "0.24"
iced = { version = "0.10", optional = true, features = ["tokio", "image"] }
tauri = { version = "1.5", optional = true }

# Diff and syntax highlighting dependencies
tree-sitter = "0.20"
syntect = "5.0"

# For interactive operations
dialoguer = "0.11"
console = "0.15"

# For hook language analysis
rust-bert = { version = "0.21", optional = true }

[dev-dependencies]
tempfile = "3.2"
assert_cmd = "2.0"
predicates = "3.0"
test-case = "3.3"

[features]
default = ["egui-ui"]
egui-ui = []
iced-ui = ["iced"]
tauri-ui = ["tauri"]
ai-hooks = ["rust-bert"]

[[bin]]
name = "monarch"
path = "src/main.rs"

[workspace]
members = ["hookmaster"]